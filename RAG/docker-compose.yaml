services:
  postgres:
    image: postgres:17
    container_name: langgraph-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: enterprise_rag

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d enterprise_rag"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: